<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Lavender</title>
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: #050505; color: #e9e2d0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Georgia, "Times New Roman", serif; }
  canvas { display: block; max-width: 100%; }
  button { font: inherit; font-size: 1rem; color: #e9e2d0; background: transparent; border: 1px solid #6b665a; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #e9e2d0; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="again" type="button">Bloom again</button>

<script>
const COLS = 96, ROWS = 76;
const LW = COLS, LH = ROWS * 2;
const RAMP = " .:-=+*#%@";

const off = document.createElement("canvas");
off.width = COLS; off.height = ROWS;
const g = off.getContext("2d", { willReadFrequently: true });

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let cw, ch, fs, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = Math.min(window.innerWidth - 8, 600);
  cw = w / COLS; ch = cw * 2; fs = cw / 0.6;
  cv.style.width = w + "px"; cv.style.height = ch * ROWS + "px";
  cv.width = w * dpr; cv.height = ch * ROWS * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const mix = (a, b, k) => a + (b - a) * k;
const rnd = a => { const x = Math.sin(a) * 43758.5453; return x - Math.floor(x); };

const BASE = { x: 48, y: LH - 4 };
const STEM = 2.6, BLOOM0 = 4.8, HOLD = 4;
const NF = 15; // flower whorls per spike

// Each stalk: top position; curve control point leans toward the top
const tops = [[48,16],[36,24],[60,22],[26,36],[70,34],[17,52],[80,50],[42,32],[55,30],[31,46],[65,44]];
const stalks = tops.map(([tx, ty], i) => ({
  i, tx, ty,
  cx: BASE.x + (tx - BASE.x) * 0.1,
  cy: BASE.y - (BASE.y - ty) * 0.6
}));

function pt(s, t) {
  const u = 1 - t;
  return {
    x: u * u * BASE.x + 2 * u * t * s.cx + t * t * s.tx,
    y: u * u * BASE.y + 2 * u * t * s.cy + t * t * s.ty,
    dx: 2 * u * (s.cx - BASE.x) + 2 * t * (s.tx - s.cx),
    dy: 2 * u * (s.cy - BASE.y) + 2 * t * (s.ty - s.cy)
  };
}

function drawLeaves(e) {
  g.strokeStyle = "rgb(96,168,92)"; g.lineWidth = 1.4; g.lineCap = "round";
  [[-16,24],[-9,34],[-3,30],[3,32],[9,34],[16,24],[-22,16],[23,16]].forEach(([dx, h]) => {
    g.beginPath(); g.moveTo(BASE.x, BASE.y);
    g.quadraticCurveTo(BASE.x + dx * 0.3, BASE.y - h * 0.8 * e, BASE.x + dx * e, BASE.y - h * e);
    g.stroke();
  });
}

function drawStem(s, sp) {
  g.strokeStyle = "rgb(120,170,106)"; g.lineWidth = 1.5; g.lineCap = "round";
  g.beginPath();
  const N = 26;
  for (let j = 0; j <= N; j++) {
    const p = pt(s, sp * j / N);
    j ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
  }
  g.stroke();
}

function floret(x, y, rx, ry, rot, col) {
  g.fillStyle = `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`;
  g.beginPath(); g.ellipse(x, y, Math.max(0.2, rx), Math.max(0.2, ry), rot, 0, Math.PI * 2); g.fill();
}

function drawSpike(s, T) {
  const start = BLOOM0 + s.i * 0.1;
  for (let k = 0; k < NF; k++) {
    const m = k / (NF - 1);
    const e = ease((T - start - k * 0.15) / 0.9);
    const size = (0.3 + 0.7 * e) * (1 - 0.4 * m);
    const p = pt(s, 0.52 + 0.48 * m);
    const a = Math.atan2(p.dy, p.dx);
    const nx = -Math.sin(a), ny = Math.cos(a);
    // bud = muted green, bloom = purple (deeper at base, paler at tip)
    const bloom = [mix(126, 190, m), mix(84, 160, m), mix(200, 246, m)];
    const bud = [132, 168, 120];
    const col = [mix(bud[0], bloom[0], e), mix(bud[1], bloom[1], e), mix(bud[2], bloom[2], e)];
    const jit = (rnd(k * 12.9 + s.i * 78.2) - 0.5) * 1.2;
    const off1 = 2.5 * size;
    floret(p.x + nx * off1 + jit, p.y + ny * off1, 2.9 * size, 1.9 * size, a, col);
    floret(p.x - nx * off1 - jit, p.y - ny * off1, 2.9 * size, 1.9 * size, a, col);
    floret(p.x, p.y, 3.1 * size, 2.1 * size, a, [col[0] * 0.93, col[1] * 0.9, col[2] * 0.97]);
  }
}

function renderScene(T) {
  g.setTransform(1, 0, 0, 0.5, 0, 0);
  g.clearRect(0, 0, LW, LH);
  drawLeaves(ease(T / 2));
  // Phase 1: stalks grow up one after another
  stalks.forEach(s => {
    const sp = ease((T - s.i * 0.2) / STEM);
    if (sp > 0) drawStem(s, sp);
  });
  // Phase 2: once a stalk is tall, its buds open from the bottom up
  stalks.forEach(s => { if (T - s.i * 0.2 >= STEM) drawSpike(s, T); });
}

function toAscii() {
  const data = g.getImageData(0, 0, COLS, ROWS).data;
  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, cv.width / dpr, cv.height / dpr);
  ctx.font = `${fs}px "Courier New", monospace`;
  ctx.textBaseline = "top";
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = (y * COLS + x) * 4;
      if (data[i + 3] < 50) continue;
      const r = data[i], gr = data[i + 1], b = data[i + 2];
      const lum = (0.3 * r + 0.59 * gr + 0.11 * b) / 255;
      let idx = Math.round(lum * (RAMP.length - 1) * 1.25);
      idx += Math.random() < 0.08 ? 1 : 0;
      idx = Math.max(1, Math.min(RAMP.length - 1, idx));
      ctx.fillStyle = `rgb(${Math.min(255, r * 1.15) | 0},${Math.min(255, gr * 1.15) | 0},${Math.min(255, b * 1.15) | 0})`;
      ctx.fillText(RAMP[idx], x * cw, y * ch);
    }
  }
}

let start = performance.now(), last = 0;
const total = BLOOM0 + 1 + NF * 0.15 + 0.9 + HOLD;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  let T = (now - start) / 1000;
  if (reduce) T = total;
  else if (T > total) { start = now; T = 0; }
  if (now - last > 40) { renderScene(T); toAscii(); last = now; }
  requestAnimationFrame(frame);
}
document.getElementById("again").addEventListener("click", () => { start = performance.now(); });
cv.addEventListener("click", () => { start = performance.now(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
