<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Bloom</title>
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: #050505; color: #e9e2d0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Georgia, "Times New Roman", serif; }
  canvas { display: block; max-width: 100%; }
  h1 { font-size: 1.35rem; font-weight: 400; font-style: italic; margin: 0; text-align: center; padding: 0 16px; }
  button { font: inherit; font-size: 1rem; color: #e9e2d0; background: transparent; border: 1px solid #6b665a; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #e9e2d0; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="again" type="button">Bloom again</button>

<script>
const COLS = 96, ROWS = 76;        // character grid
const LW = COLS, LH = ROWS * 2;    // logical drawing space (cells are ~2x taller than wide)
const RAMP = " .:-=+*#%@";

const off = document.createElement("canvas");
off.width = COLS; off.height = ROWS;
const octx = off.getContext("2d", { willReadFrequently: true });

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let cw, ch, fs, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = Math.min(window.innerWidth - 8, 600);
  cw = w / COLS; ch = cw * 2; fs = cw / 0.6;
  cv.style.width = w + "px"; cv.style.height = ch * ROWS + "px";
  cv.width = w * dpr; cv.height = ch * ROWS * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// Flowers: head position, size, petal colour, bloom delay (seconds)
const flowers = [
  { x: 30, y: 50,  s: 0.75, c: [184, 156, 232],  d: 0.9, t: -0.25 },
  { x: 66, y: 44,  s: 0.70, c: [152, 122, 216],  d: 1.3, t: 0.3 },
  { x: 48, y: 58,  s: 1.0,  c: [168, 130, 226],   d: 0.2, t: 0 },
  { x: 22, y: 84,  s: 0.85, c: [198, 168, 240],  d: 0.6, t: -0.35 },
  { x: 72, y: 84,  s: 0.85, c: [224, 206, 250], d: 1.0, t: 0.4 },
  { x: 48, y: 98,  s: 1.1,  c: [210, 184, 244], d: 1.6, t: 0 }
];
const BASE = { x: 48, y: LH - 4 };
const STEM = 2.4, BLOOM0 = 3.8, DUR = 3.2, HOLD = 4.5;

const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const mix = (a, b, k) => a + (b - a) * k;
const rgb = (c, k = 1) => `rgb(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0})`;

function drawStem(f, p) {
  const g = octx;
  const tipX = f.x, tipY = mix(BASE.y, f.y, p);
  g.strokeStyle = "rgb(50,170,60)"; g.lineWidth = 2.6; g.lineCap = "round";
  g.beginPath(); g.moveTo(BASE.x, BASE.y);
  g.quadraticCurveTo(BASE.x + (tipX - BASE.x) * 0.2, (BASE.y + tipY) / 2 + 8, tipX, tipY);
  g.stroke();
  // leaf
  const lk = ease((p - 0.5) * 2);
  if (lk > 0) {
    const lx = mix(BASE.x, f.x, 0.5), ly = mix(BASE.y, f.y, 0.5);
    const dir = f.x < BASE.x ? -1 : 1;
    g.fillStyle = "rgb(70,190,60)";
    g.beginPath(); g.moveTo(lx, ly);
    g.quadraticCurveTo(lx + dir * 11 * lk, ly - 6 * lk, lx + dir * 17 * lk, ly - 15 * lk);
    g.quadraticCurveTo(lx + dir * 6 * lk, ly - 1, lx, ly);
    g.fill();
  }
}

function petal(L, w, col, k) {
  const g = octx;
  const grad = g.createLinearGradient(0, 0, 0, -L);
  grad.addColorStop(0, "rgb(246,238,255)");
  grad.addColorStop(0.3, rgb(col, 0.8));
  grad.addColorStop(1, rgb(col, 1.05));
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(0, 0);
  g.bezierCurveTo(w, -L * 0.25, w * 0.9, -L * 0.8, 0, -L);
  g.bezierCurveTo(-w * 0.9, -L * 0.8, -w, -L * 0.25, 0, 0);
  g.fill();
  g.strokeStyle = rgb(col, 0.55); g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(0, -1); g.lineTo(0, -L * 0.85); g.stroke();
}

function drawHead(f, p) {
  const g = octx;
  const e = ease(p);
  const L = 22 * f.s * mix(0.55, 1, e);
  const w = 7.5 * f.s * mix(0.35, 1, e);
  const order = [0, 2, 4, 1, 3, 5];
  g.save();
  g.translate(f.x, f.y);
  g.rotate(f.t * (1 - e * 0.5));
  for (const i of order) {
    const open = (i / 6) * Math.PI * 2 + 0.3 + Math.sin(i * 7.1 + f.x) * 0.12;
    const closed = (i - 2.5) * 0.09;
    const a = mix(closed, open, e);
    g.save(); g.rotate(a);
    g.scale(1, mix(1, 0.82, e));
    petal(L, w, f.c, e);
    g.restore();
  }
  // stamens
  if (e > 0.5) {
    g.strokeStyle = "rgb(210,160,60)"; g.fillStyle = "rgb(120,40,20)"; g.lineWidth = 0.7;
    for (let i = 0; i < 5; i++) {
      const a = -1.2 + i * 0.6, r = 9 * f.s * e;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(a) * r, -Math.cos(a) * r); g.stroke();
      g.beginPath(); g.arc(Math.sin(a) * r, -Math.cos(a) * r, 1, 0, 7); g.fill();
    }
  }
  g.restore();
}

function renderScene(T) {
  octx.setTransform(1, 0, 0, 0.5, 0, 0);
  octx.clearRect(0, 0, LW, LH);
  // Phase 1: stems grow up from the base, one after another
  const stemRaw = (f, i) => Math.min(1, Math.max(0, (T - i * 0.25) / STEM));
  flowers.forEach((f, i) => { const s = stemRaw(f, i); if (s > 0) drawStem(f, ease(s)); });
  // Phase 2: once a stem has reached its top, the bud opens
  flowers.forEach((f, i) => {
    if (stemRaw(f, i) < 1) return;
    drawHead(f, ease((T - BLOOM0 - f.d * 0.5) / DUR));
  });
}

function toAscii(T) {
  const data = octx.getImageData(0, 0, COLS, ROWS).data;
  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, cv.width / dpr, cv.height / dpr);
  ctx.font = `${fs}px "Courier New", monospace`;
  ctx.textBaseline = "top";
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = (y * COLS + x) * 4;
      const a = data[i + 3];
      if (a < 50) continue;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const lum = (0.3 * r + 0.59 * g + 0.11 * b) / 255;
      let idx = Math.round(lum * (RAMP.length - 1) * 1.25);
      idx += Math.random() < 0.08 ? 1 : 0; // shimmer
      idx = Math.max(1, Math.min(RAMP.length - 1, idx));
      ctx.fillStyle = `rgb(${Math.min(255, r * 1.15) | 0},${Math.min(255, g * 1.15) | 0},${Math.min(255, b * 1.15) | 0})`;
      ctx.fillText(RAMP[idx], x * cw, y * ch);
    }
  }
}

let start = performance.now(), last = 0;
const total = BLOOM0 + 0.8 + DUR + HOLD;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function frame(now) {
  let T = (now - start) / 1000;
  if (reduce) T = total;
  else if (T > total) { start = now; T = 0; }
  if (now - last > 40) { // ~25fps keeps it light on phones
    renderScene(T); toAscii(T); last = now;
  }
  requestAnimationFrame(frame);
}
document.getElementById("again").addEventListener("click", () => { start = performance.now(); });
cv.addEventListener("click", () => { start = performance.now(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
